<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nestr — Galerie d'inspiration</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600..800&amp;family=Figtree:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<style>
h1, h2, h3 { font-family: var(--display); }
.data { font-family: var(--data); font-weight: 500; letter-spacing: -0.02em; font-size: 0.92em; }
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--birch)}
a{color:var(--ink)}a:hover{color:var(--ink-muted)}
input[type=range]{accent-color:var(--ink)}
</style>
<link rel="stylesheet" href="../glass.css">
<script src="../glass.js" defer></script>
<style>
#grille { column-count: 2; column-gap: 10px; }
.photo { position: relative; display: block; width: 100%; margin: 0 0 10px; padding: 0; border: 0; border-radius: 18px; overflow: hidden; background: rgba(255,255,255,0.3); cursor: pointer; break-inside: avoid;
  box-shadow: 0 8px 20px -12px rgba(20,51,42,0.5); animation: arrive 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
.photo img { display: block; width: 100%; height: auto; min-height: 90px; transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.3s ease; }
.photo:hover img { transform: scale(1.05); }
.photo[aria-pressed="true"] { outline: 3px solid var(--pine); outline-offset: -3px; }
.photo[aria-pressed="true"] img { filter: brightness(0.82); }
.photo i { position: absolute; right: 8px; top: 8px; width: 26px; height: 26px; border-radius: 50%; background: var(--pine); display: none; align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--surface); }
.photo[aria-pressed="true"] i { display: flex; animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(0.96); } }
@keyframes pop { from { transform: scale(0.3); } }
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--surface); color: var(--ink); font-family: var(--body); display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 16px 24px 0; flex-shrink: 0">
    <div style="display: flex; align-items: center; height: 44px">
      <a href="envies.html" aria-label="Retour" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: var(--ink)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
    </div>
    <h2 style="margin: 12px 0 0; font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.8px">Galerie d'inspiration</h2>
    <p id="aide" role="status" style="margin: 6px 0 0; font-size: 15px; line-height: 1.45; color: var(--ink-muted)">Choisis jusqu'à 3 photos qui te ressemblent.</p>
  </div>
  <div id="themes" role="group" aria-label="Thèmes" style="display: flex; gap: 6px; padding: 14px 20px 2px; overflow-x: auto; flex-shrink: 0; scrollbar-width: none"></div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 12px 20px 100px">
    <div id="grille"></div>
  </div>
  <a id="valider" href="envies.html" aria-disabled="true" style="position: absolute; left: 24px; right: 24px; bottom: 28px; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: var(--pine); color: var(--surface); text-decoration: none; font-size: 16px; font-weight: 600; opacity: 0.35; pointer-events: none; z-index: 5">Utiliser ces photos</a>
</div>
<script src="nestr.js"></script>
<script>
// Galerie d'inspiration : photos rangées dans le Storage Supabase (route /api/gallery).
// Les photos choisies rejoignent « Tes inspirations » et sont lues par le modèle de vision comme les photos de l'appareil.
(function () {
  var grid = document.getElementById('grille'), help = document.getElementById('aide'), go = document.getElementById('valider');
  var MAX = 3, picked = [];
  function refresh() {
    go.textContent = picked.length ? 'Utiliser ' + (picked.length > 1 ? 'ces ' + picked.length + ' photos' : 'cette photo') : 'Utiliser ces photos';
    go.style.opacity = picked.length ? '1' : '0.35';
    go.style.pointerEvents = picked.length ? 'auto' : 'none';
    go.setAttribute('aria-disabled', picked.length ? 'false' : 'true');
  }
  function tile(photo, i) {
    var b = document.createElement('button'), img = document.createElement('img'), tick = document.createElement('i');
    b.type = 'button'; b.className = 'photo'; b.setAttribute('aria-pressed', 'false');
    b.style.animationDelay = Math.min(i, 10) * 0.05 + 's';
    img.crossOrigin = 'anonymous'; // nécessaire pour réduire la photo avant de l'envoyer à l'analyse
    img.loading = 'lazy'; img.alt = 'Photo d’inspiration' + (photo.theme ? ' · ' + photo.theme : '');
    img.src = photo.url;
    img.onerror = function () { b.remove(); };
    tick.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FAFAF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
    b.append(img, tick);
    b.addEventListener('click', function () {
      var at = picked.indexOf(img);
      if (at >= 0) picked.splice(at, 1);
      else if (picked.length < MAX) picked.push(img);
      else { help.textContent = MAX + ' photos au plus : retires-en une pour en choisir une autre.'; return; }
      b.setAttribute('aria-pressed', picked.indexOf(img) >= 0 ? 'true' : 'false');
      help.textContent = 'Choisis jusqu’à ' + MAX + ' photos qui te ressemblent.';
      refresh();
    });
    return b;
  }
  // Même réduction que pour les photos de l'appareil : 768 px au plus, JPEG.
  function shrink(img) {
    var k = Math.min(1, 768 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.8);
  }
  go.addEventListener('click', function (ev) {
    try {
      var kept = JSON.parse(sessionStorage.getItem('nestr-inspirations') || '[]');
      var added = picked.map(function (img) { return { src: shrink(img), from: 'Galerie' }; });
      sessionStorage.setItem('nestr-inspirations', JSON.stringify(added.concat(kept).slice(0, 6)));
    } catch (e) {
      ev.preventDefault();
      help.textContent = 'Ces photos n’ont pas pu être reprises. Réessaie avec une autre.';
    }
  });
  fetch('/api/gallery').then(function (r) { return r.json(); }).then(function (j) {
    if (!j.photos || !j.photos.length) { help.textContent = 'La galerie est vide pour le moment. Ajoute tes propres photos depuis l’écran précédent.'; return; }
    var tiles = j.photos.map(function (p, i) { var t = tile(p, i); t.dataset.theme = p.theme || ''; grid.appendChild(t); return t; });
    // Un thème par dossier de la galerie : la puce filtre la grille (les photos déjà choisies restent choisies).
    var bar = document.getElementById('themes'), style = (Nestr.get().style || '').toLowerCase();
    function chip(name, value) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = name; b.setAttribute('aria-pressed', 'false');
      b.style.cssText = 'flex-shrink:0;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--body);cursor:pointer;white-space:nowrap';
      b.addEventListener('click', function () {
        [].forEach.call(bar.children, function (c) { var on = c === b; c.setAttribute('aria-pressed', on ? 'true' : 'false'); c.style.background = on ? 'var(--pine)' : 'var(--surface)'; c.style.color = on ? 'var(--surface)' : 'var(--ink)'; });
        tiles.forEach(function (t) { t.style.display = value === null || t.dataset.theme === value ? 'block' : 'none'; });
      });
      bar.appendChild(b);
      return b;
    }
    var all = chip('Tout', null), mine = null;
    (j.themes || []).forEach(function (t) { var c = chip(t, t); if (style && t.toLowerCase().indexOf(style.split(/[ -]/)[0]) === 0) mine = c; });
    (mine || all).click(); // le thème du style choisi à l'étape précédente s'ouvre en premier
  }).catch(function () { help.textContent = 'La galerie est injoignable pour le moment.'; });
  refresh();
})();
</script>
</body>
</html>
