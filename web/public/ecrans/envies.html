<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nestr — Tes envies</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600..800&amp;family=Figtree:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<style>
h1, h2, h3 { font-family: var(--display); }
.data { font-family: var(--data); font-weight: 500; letter-spacing: -0.02em; font-size: 0.92em; }
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--birch)}
a{color:var(--ink)}a:hover{color:var(--ink-muted)}
</style>
<link rel="stylesheet" href="../glass.css">
<script src="../glass.js" defer></script>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--surface); color: var(--ink); font-family: var(--body); display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 16px 24px 0; flex-shrink: 0">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
      <a href="style.html" aria-label="Retour" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: var(--ink)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div role="img" aria-label="Étape 3 sur 4" style="display: flex; gap: 6px">
        <span style="width: 20px; height: 4px; border-radius: 2px; background: var(--pine)"></span>
        <span style="width: 20px; height: 4px; border-radius: 2px; background: var(--pine)"></span>
        <span style="width: 20px; height: 4px; border-radius: 2px; background: var(--pine)"></span>
        <span style="width: 20px; height: 4px; border-radius: 2px; background: var(--line)"></span>
      </div>
      <a href="agent.html" style="min-width: 44px; height: 44px; padding: 0 4px; margin-right: -8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: var(--ink-muted); text-decoration: none">Passer</a>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 24px 20px; display: flex; flex-direction: column">
    <h2 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.8px">Tes envies</h2>
    <p style="margin: 6px 0 0; font-size: 15px; line-height: 1.45; color: var(--ink-muted)">Dis-le avec tes mots, montre-le en photos.</p>

    <div style="margin-top: 18px; padding: 16px; border-radius: 22px; background: var(--birch)">
      <div style="display: flex; align-items: center; gap: 8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--lingon)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8L12 3z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/></svg>
        <label for="smart" style="font-size: 14px; font-weight: 600">Recherche intelligente</label>
      </div>
      <textarea id="smart" rows="3" style="display: block; box-sizing: border-box; width: 100%; margin-top: 10px; padding: 12px 14px; border: 1.5px solid var(--ink-muted); border-radius: 14px; background: var(--surface); resize: none; outline: none; font: 400 15px/1.45 var(--body); color: var(--ink)">Un salon lumineux pour recevoir 6 personnes, avec un coin lecture près de la fenêtre. J'ai un chat.</textarea>
      <p style="margin: 12px 0 8px; font-size: 13px; color: var(--ink-muted)">Nestr a compris :</p>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <p style="margin: 0; padding: 6px 12px; border-radius: 999px; background: var(--surface); font-size: 13px; font-weight: 500">6 places assises</p>
        <p style="margin: 0; padding: 6px 12px; border-radius: 999px; background: var(--surface); font-size: 13px; font-weight: 500">Coin lecture</p>
        <p style="margin: 0; padding: 6px 12px; border-radius: 999px; background: var(--surface); font-size: 13px; font-weight: 500">Tons clairs</p>
        <p style="margin: 0; padding: 6px 12px; border-radius: 999px; background: var(--surface); font-size: 13px; font-weight: 500">Tissu anti-griffes</p>
      </div>
    </div>

    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 24px">
      <p style="margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.3px">Tes inspirations</p>
      <p style="margin: 0; font-size: 13px; color: var(--ink-muted)">0 photo</p>
    </div>
    <div style="display: flex; gap: 10px; margin-top: 12px">
      <button type="button" aria-label="Ajouter des photos d'inspiration" style="width: 96px; height: 120px; flex-shrink: 0; border-radius: var(--radius-card); border: 1.5px dashed var(--ink-muted); background: var(--surface); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 500 13px var(--body)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Ajouter
      </button>
      <a id="vers-galerie" href="galerie.html" style="flex: 1; min-width: 0; height: 120px; box-sizing: border-box; padding: 14px; border-radius: var(--radius-card); background: var(--birch); color: var(--ink); text-decoration: none; display: flex; flex-direction: column; justify-content: space-between">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--lingon)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="10" rx="2"/><rect x="13" y="3" width="8" height="6" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/><rect x="3" y="15" width="8" height="6" rx="2"/></svg>
        <span style="font-size: 14px; font-weight: 600; line-height: 1.25">Consultez notre galerie d'inspiration <span aria-hidden="true">→</span></span>
      </a>
    </div>
    <div id="mes-photos" style="display: none; gap: 10px; margin-top: 10px; overflow-x: auto; flex-shrink: 0"></div>
    <div style="display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 10px 12px; border-radius: 14px; background: var(--birch)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--lingon)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8L12 3z"/></svg>
      <p style="margin: 0; font-size: 13px; line-height: 1.35; color: var(--ink)">Ajoute une photo qui t’inspire.</p>
    </div>

    <p style="margin: 24px 0 12px; font-size: 17px; font-weight: 700; letter-spacing: -0.3px">À chercher</p>
    <div style="display: flex; gap: 8px">
      <button type="button" class="pill" data-label="Meubles" aria-pressed="true" style="flex: 1; height: 44px; border-radius: 22px; font: 500 14px var(--body); cursor: pointer; background: var(--pine); color: var(--surface); border: 1.5px solid var(--pine);">✓ Meubles</button>
<button type="button" class="pill" data-label="Déco" aria-pressed="true" style="flex: 1; height: 44px; border-radius: 22px; font: 500 14px var(--body); cursor: pointer; background: var(--pine); color: var(--surface); border: 1.5px solid var(--pine);">✓ Déco</button>
<button type="button" class="pill" data-label="Peinture" aria-pressed="true" style="flex: 1; height: 44px; border-radius: 22px; font: 500 14px var(--body); cursor: pointer; background: var(--pine); color: var(--surface); border: 1.5px solid var(--pine);">✓ Peinture</button>
    </div>

    <p style="margin: 24px 0 12px; font-size: 17px; font-weight: 700; letter-spacing: -0.3px">Critères</p>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <button type="button" class="pill crit" data-label="Seconde main" aria-pressed="false" style="padding: 0 16px; height: 44px; border-radius: 22px; font: 500 14px var(--body); cursor: pointer; background: var(--surface); color: var(--ink); border: 1.5px solid var(--line);">Seconde main</button>
<button type="button" class="pill crit" data-label="Éco-responsable" aria-pressed="true" style="padding: 0 16px; height: 44px; border-radius: 22px; font: 500 14px var(--body); cursor: pointer; background: var(--pine); color: var(--surface); border: 1.5px solid var(--pine);">✓ Éco-responsable</button>
<button type="button" class="pill crit" data-label="Livré en 1 semaine" aria-pressed="false" style="padding: 0 16px; height: 44px; border-radius: 22px; font: 500 14px var(--body); cursor: pointer; background: var(--surface); color: var(--ink); border: 1.5px solid var(--line);">Livré en 1 semaine</button>
<button type="button" class="pill crit" data-label="Facile à monter" aria-pressed="true" style="padding: 0 16px; height: 44px; border-radius: 22px; font: 500 14px var(--body); cursor: pointer; background: var(--pine); color: var(--surface); border: 1.5px solid var(--pine);">✓ Facile à monter</button>
<button type="button" class="pill crit" data-label="Animaux" aria-pressed="true" style="padding: 0 16px; height: 44px; border-radius: 22px; font: 500 14px var(--body); cursor: pointer; background: var(--pine); color: var(--surface); border: 1.5px solid var(--pine);">✓ Animaux</button>
<button type="button" class="pill crit" data-label="Enfants" aria-pressed="false" style="padding: 0 16px; height: 44px; border-radius: 22px; font: 500 14px var(--body); cursor: pointer; background: var(--surface); color: var(--ink); border: 1.5px solid var(--line);">Enfants</button>
<button type="button" class="pill crit" data-label="Rangement caché" aria-pressed="false" style="padding: 0 16px; height: 44px; border-radius: 22px; font: 500 14px var(--body); cursor: pointer; background: var(--surface); color: var(--ink); border: 1.5px solid var(--line);">Rangement caché</button>
<button type="button" class="pill crit" data-label="Fabriqué en France" aria-pressed="false" style="padding: 0 16px; height: 44px; border-radius: 22px; font: 500 14px var(--body); cursor: pointer; background: var(--surface); color: var(--ink); border: 1.5px solid var(--line);">Fabriqué en France</button>
    </div>
  </div>

  <div style="padding: 12px 24px 34px; flex-shrink: 0; border-top: 1px solid var(--line)">
    <a href="agent.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: var(--pine); color: var(--surface); text-decoration: none; font-size: 16px; font-weight: 600" id="cta">Lancer la recherche</a>
  </div>
</div>
<script>
function refreshCta() {
  var n = document.querySelectorAll('.crit[aria-pressed="true"]').length + 4;
  document.getElementById('cta').textContent = 'Lancer la recherche · ' + n + ' critères';
}
document.querySelectorAll('.pill').forEach(function (p) {
  p.addEventListener('click', function () {
    var on = p.getAttribute('aria-pressed') !== 'true';
    p.setAttribute('aria-pressed', on ? 'true' : 'false');
    p.textContent = (on ? '✓ ' : '') + p.dataset.label;
    p.style.background = on ? 'var(--pine)' : 'var(--surface)';
    p.style.color = on ? 'var(--surface)' : 'var(--ink)';
    p.style.borderColor = on ? 'var(--ink)' : 'var(--line)';
    refreshCta();
  });
});
refreshCta();
</script>
<script src="nestr.js"></script>
<script>
// « Lancer la recherche » et « Passer » enregistrent la demande et démarrent un nouveau projet.
// « Nestr a compris » : libellés extraits du texte par l'IA (gpt-oss-120b), mis à jour après la saisie.
if (Nestr.live) {
  var smart = document.getElementById('smart'), label = smart.nextElementSibling, chips = label.nextElementSibling;
  var chipTpl = chips.children[0].cloneNode(true), timer = null, asked = 0;
  var understand = function () {
    var mine = ++asked, text = smart.value.trim();
    if (!text) { label.textContent = 'Décris ton salon idéal.'; chips.textContent = ''; return; }
    label.textContent = 'Nestr lit ta demande…';
    fetch('/api/understand', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                               body: JSON.stringify({ text: text, style: Nestr.get().style || 'Scandinave' }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (mine !== asked) return; // une saisie plus récente est en cours
        chips.textContent = '';
        (j.understood || []).forEach(function (u) { var c = chipTpl.cloneNode(true); c.textContent = u; chips.appendChild(c); });
        label.textContent = j.llm && chips.children.length ? 'Nestr a compris :' : "Nestr n'a pas pu lire ce texte ; le style choisi sera utilisé.";
      })
      .catch(function () { if (mine === asked) { label.textContent = 'Serveur Nester injoignable.'; chips.textContent = ''; } });
  };
  smart.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(understand, 900); });
  understand();
}
// Photos d'inspiration : ajout depuis l'appareil, puis lecture par un modèle de vision (Hugging Face).
if (Nestr.live) (function () {
  var addBtn = document.querySelector('button[aria-label^="Ajouter des photos"]'), row = document.getElementById('mes-photos');
  var countP = addBtn.parentNode.previousElementSibling.children[1], detectedP = row.nextElementSibling.querySelector('p');
  var asked = 0, photos = [];
  var tileTpl = document.createElement('div');
  tileTpl.style.cssText = 'position:relative;width:96px;height:120px;flex-shrink:0;border-radius:var(--radius-card);overflow:hidden';
  tileTpl.innerHTML = '<img alt="" style="display:block;width:100%;height:100%;object-fit:cover"><p style="position:absolute;left:8px;top:8px;margin:0;padding:2px 8px;border-radius:999px;background:var(--surface);font-size:11px;font-weight:500"></p>';
  // Les photos choisies (appareil ou galerie) et le texte saisi sont gardés le temps de la visite.
  function remember() {
    try { sessionStorage.setItem('nestr-inspirations', JSON.stringify(photos.map(function (p) { return { src: p.src, from: p.from }; }))); } catch (e) {}
  }
  function show(src, from, first) {
    var tile = tileTpl.cloneNode(true), photo = { src: src, tile: tile, from: from };
    tile.querySelector('img').src = src;
    tile.querySelector('img').alt = from === 'Galerie' ? 'Photo de la galerie d’inspiration' : 'Ta photo d’inspiration';
    tile.querySelector('p').textContent = from;
    if (first) { row.insertBefore(tile, row.firstChild); photos.unshift(photo); } else { row.appendChild(tile); photos.push(photo); }
    removable(photo);
  }
  var picker = document.createElement('input');
  picker.type = 'file'; picker.accept = 'image/*'; picker.multiple = true; picker.style.display = 'none';
  document.body.appendChild(picker);
  addBtn.addEventListener('click', function () { picker.click(); });

  function removable(photo) {
    photo.tile.style.cursor = 'pointer';
    photo.tile.setAttribute('role', 'button');
    photo.tile.setAttribute('tabindex', '0');
    photo.tile.setAttribute('aria-label', 'Retirer cette photo');
    photo.tile.title = 'Retirer cette photo';
    var drop = function () { photos.splice(photos.indexOf(photo), 1); photo.tile.remove(); analyse(); };
    photo.tile.addEventListener('click', drop);
    photo.tile.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); drop(); } });
  }

  // La photo est réduite à 768 px dans le navigateur avant d'être envoyée.
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var k = Math.min(1, 768 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        resolve(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }
  picker.addEventListener('change', function () {
    Promise.all([].slice.call(picker.files, 0, 3).map(shrink)).then(function (urls) {
      urls.forEach(function (src) {
        show(src, 'Ta photo', true);
      });
      picker.value = '';
      analyse();
    }).catch(function () { detectedP.textContent = 'Cette image n’a pas pu être lue.'; });
  });

  function analyse() {
    var mine = ++asked, used = photos.slice(0, 3);
    countP.textContent = photos.length + ' photo' + (photos.length > 1 ? 's' : '');
    row.style.display = photos.length ? 'flex' : 'none';
    remember();
    if (!used.length) { detectedP.textContent = 'Ajoute une photo qui t’inspire.'; Nestr.set({ inspiration: null }); return; }
    detectedP.textContent = 'Nestr regarde tes photos…';
    fetch('/api/inspire', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ images: used.map(function (p) { return p.src; }) }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (mine !== asked) return;
        if (!j.llm || !j.detected.length) { detectedP.textContent = 'Photos non analysées ; ton texte et le style choisi seront utilisés.'; Nestr.set({ inspiration: null }); return; }
        detectedP.textContent = 'Détecté : ' + j.detected.join(', ');
        Nestr.set({ inspiration: { styles: j.styles, colors: j.colors, accent_color: j.accent_color, materials: j.materials, ambiance: j.ambiance, brief: j.brief, detected: j.detected } });
      })
      .catch(function () { if (mine === asked) detectedP.textContent = 'Serveur Nester injoignable.'; });
  }
  try { JSON.parse(sessionStorage.getItem('nestr-inspirations') || '[]').slice(0, 6).forEach(function (p) { show(p.src, p.from); }); } catch (e) {}
  var smart = document.getElementById('smart'), kept = null;
  try { kept = sessionStorage.getItem('nestr-envie'); } catch (e) {}
  if (kept !== null) { smart.value = kept; smart.dispatchEvent(new Event('input')); }
  smart.addEventListener('input', function () { try { sessionStorage.setItem('nestr-envie', smart.value); } catch (e) {} });
  analyse();
})();
document.querySelectorAll('a[href="agent.html"]').forEach(function (a) {
  a.addEventListener('click', function () {
    var on = function (label) { var p = document.querySelector('.pill[data-label="' + label + '"]'); return !p || p.getAttribute('aria-pressed') === 'true'; };
    Nestr.set({ text: document.getElementById('smart').value, projectId: null,
                wants: { meubles: on('Meubles'), deco: on('Déco'), peinture: on('Peinture') } });
  });
});
</script>
</body>
</html>
