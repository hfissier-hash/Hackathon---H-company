<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nestr — Vos pièces</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#E9E7E2}
a{color:#111111}a:hover{color:#444444}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #111111; font-family: 'Inter', Arial, sans-serif; display: flex; flex-direction: column; padding: 16px 24px 34px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <a href="accueil.html" aria-label="Retour" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: #111111">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div role="img" aria-label="Étape 1 sur 4" style="display: flex; gap: 6px">
      <span style="width: 20px; height: 4px; border-radius: 2px; background: #111111"></span>
      <span style="width: 20px; height: 4px; border-radius: 2px; background: #E7E5E0"></span>
      <span style="width: 20px; height: 4px; border-radius: 2px; background: #E7E5E0"></span>
      <span style="width: 20px; height: 4px; border-radius: 2px; background: #E7E5E0"></span>
    </div>
    <span style="width: 44px"></span>
  </div>

  <h2 style="margin: 24px 0 0; font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.8px">Vos pièces</h2>
  <p style="margin: 6px 0 0; font-size: 15px; line-height: 1.45; color: #6B6B6B">Les dimensions, et la porte la plus étroite.</p>

  <div style="display: flex; gap: 8px; margin-top: 20px">
    <button type="button" aria-pressed="true" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 0; background: #111111; color: #FFFFFF; font: 600 14px 'Inter', Arial, sans-serif">Salon</button>
    <button type="button" aria-pressed="false" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 0; background: #F4F3F0; color: #111111; font: 500 14px 'Inter', Arial, sans-serif">Chambre</button>
    <button type="button" aria-label="Ajouter une pièce" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #F4F3F0; color: #111111; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <div style="margin-top: 16px; padding: 20px 20px 16px; border-radius: 24px; background: #F4F3F0">
    <svg width="302" height="259" viewBox="0 0 320 274" fill="none" role="img" aria-label="Plan du salon : 4,20 m sur 3,60 m, fenêtre de 1,20 m, porte de 83 cm">
      <path d="M40 12 H292 M40 8 V16 M292 8 V16" stroke="#B84F2C" stroke-width="1"/>
      <rect x="140" y="4" width="52" height="16" fill="#F4F3F0"/>
      <text x="166" y="16" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#B84F2C">4,20 m</text>
      <path d="M16 30 V246 M12 30 H20 M12 246 H20" stroke="#B84F2C" stroke-width="1"/>
      <rect x="8" y="112" width="16" height="52" fill="#F4F3F0"/>
      <text x="16" y="142" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#B84F2C" transform="rotate(-90 16 138)">3,60 m</text>
      <rect x="40" y="30" width="252" height="216" fill="#FFFFFF"/>
      <path d="M40 30 H94 M166 30 H292 V246 H272 M222 246 H40 V30" stroke="#111111" stroke-width="3" stroke-linecap="square"/>
      <path d="M94 30 H166" stroke="#9FB6C1" stroke-width="3"/>
      <path d="M222 246 A50 50 0 0 1 272 196 M272 246 V196" stroke="#A3A39E" stroke-width="1"/>
      <rect x="222" y="254" width="50" height="18" rx="9" fill="#B84F2C"/>
      <text x="247" y="267" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">83 cm</text>
      <text x="166" y="136" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#111111">Salon</text>
      <text x="166" y="156" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B6B6B">15,1 m²</text>
    </svg>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 20px; row-gap: 18px; margin-top: 24px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="f-long" style="font-size: 13px; color: #6B6B6B">Longueur</label>
      <div style="display: flex; align-items: baseline; gap: 6px; padding: 4px 0 8px; border-bottom: 1.5px solid #8A8A85">
        <input id="f-long" type="text" inputmode="decimal" value="4,20" style="flex: 1; min-width: 0; padding: 0; border: 0; background: transparent; outline: none; font: 600 20px 'Inter', Arial, sans-serif; color: #111111">
        <span style="font-size: 15px; color: #6B6B6B">m</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="f-larg" style="font-size: 13px; color: #6B6B6B">Largeur</label>
      <div style="display: flex; align-items: baseline; gap: 6px; padding: 4px 0 8px; border-bottom: 1.5px solid #8A8A85">
        <input id="f-larg" type="text" inputmode="decimal" value="3,60" style="flex: 1; min-width: 0; padding: 0; border: 0; background: transparent; outline: none; font: 600 20px 'Inter', Arial, sans-serif; color: #111111">
        <span style="font-size: 15px; color: #6B6B6B">m</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="f-haut" style="font-size: 13px; color: #6B6B6B">Hauteur sous plafond</label>
      <div style="display: flex; align-items: baseline; gap: 6px; padding: 4px 0 8px; border-bottom: 1.5px solid #8A8A85">
        <input id="f-haut" type="text" inputmode="decimal" value="2,50" style="flex: 1; min-width: 0; padding: 0; border: 0; background: transparent; outline: none; font: 600 20px 'Inter', Arial, sans-serif; color: #111111">
        <span style="font-size: 15px; color: #6B6B6B">m</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="f-porte" style="font-size: 13px; color: #B84F2C; font-weight: 500">Porte la plus étroite</label>
      <div style="display: flex; align-items: baseline; gap: 6px; padding: 4px 0 8px; border-bottom: 1.5px solid #B84F2C">
        <input id="f-porte" type="text" inputmode="numeric" value="83" style="flex: 1; min-width: 0; padding: 0; border: 0; background: transparent; outline: none; font: 600 20px 'Inter', Arial, sans-serif; color: #111111">
        <span style="font-size: 15px; color: #6B6B6B">cm</span>
      </div>
    </div>
  </div>

  <div style="flex: 1"></div>
  <a href="style.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #111111; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 600">Continuer</a>
</div>

<script src="nestr.js"></script>
<script>
// Les dimensions sont vérifiées ici, avant de continuer, pour ne pas échouer plus loin dans la recherche.
(function () {
  var FIELDS = [ // id, clé envoyée, unité affichée, minimum, maximum, nom
    ['f-long', 'width_cm', 'm', 2, 10, 'La longueur'], ['f-larg', 'length_cm', 'm', 2, 10, 'La largeur'],
    ['f-haut', 'height_cm', 'm', 2, 4, 'La hauteur'], ['f-porte', 'door_cm', 'cm', 60, 200, 'La porte']];
  var next = document.querySelector('a[href="style.html"]');
  var message = document.createElement('p');
  message.setAttribute('role', 'alert');
  message.style.cssText = 'margin:0 0 10px;min-height:18px;font-size:13px;font-weight:500;color:#B84F2C;text-align:center';
  next.parentNode.insertBefore(message, next);

  // Tolère « 360 » saisi en centimètres dans un champ en mètres, et « 0,83 » en mètres pour la porte.
  function read(f) {
    var n = Nestr.num(document.getElementById(f[0]).value, NaN);
    if (f[2] === 'm' && n > 20) n = n / 100;
    if (f[2] === 'cm' && n < 3) n = n * 100;
    return n;
  }
  function check() {
    var room = {}, error = '';
    FIELDS.forEach(function (f) {
      var n = read(f), input = document.getElementById(f[0]), bad = !(n >= f[3] && n <= f[4]);
      input.setAttribute('aria-invalid', bad ? 'true' : 'false');
      input.style.color = bad ? '#B84F2C' : '#111111';
      if (bad && !error) error = f[5] + ' doit être comprise entre ' + f[3] + ' et ' + f[4] + ' ' + f[2] + '.';
      room[f[1]] = Math.round(f[2] === 'm' ? n * 100 : n);
    });
    message.textContent = error;
    next.style.opacity = error ? '0.35' : '1';
    next.setAttribute('aria-disabled', error ? 'true' : 'false');
    if (!error) { // le plan suit la saisie
      var texts = document.querySelectorAll('svg[role="img"] text'), fr = function (cm) { return (cm / 100).toFixed(2).replace('.', ','); };
      if (texts.length >= 5) {
        texts[0].textContent = fr(room.width_cm) + ' m';
        texts[1].textContent = fr(room.length_cm) + ' m';
        texts[2].textContent = room.door_cm + ' cm';
        texts[4].textContent = (room.width_cm * room.length_cm / 10000).toFixed(1).replace('.', ',') + ' m²';
      }
    }
    return error ? null : room;
  }
  FIELDS.forEach(function (f) { document.getElementById(f[0]).addEventListener('input', check); });
  // Reprend la dernière saisie si on revient sur cet écran.
  var saved = Nestr.get().room;
  if (saved) FIELDS.forEach(function (f) {
    if (saved[f[1]]) document.getElementById(f[0]).value = f[2] === 'm' ? (saved[f[1]] / 100).toFixed(2).replace('.', ',') : saved[f[1]];
  });
  check();
  next.addEventListener('click', function (ev) {
    var room = check();
    if (!room) return ev.preventDefault();
    Nestr.set({ room: room, projectId: null });
  });
})();
</script>
</body>
</html>
