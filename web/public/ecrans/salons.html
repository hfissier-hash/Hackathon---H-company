<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nestr — Mes salons</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600..800&amp;family=Figtree:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<style>
h1, h2, h3 { font-family: var(--display); }
.data { font-family: var(--data); font-weight: 500; letter-spacing: -0.02em; font-size: 0.92em; }
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--birch)}
a{color:var(--ink)}a:hover{color:var(--ink-muted)}
input[type=range]{accent-color:var(--ink)}
</style>
<link rel="stylesheet" href="../glass.css">
<script src="../glass.js" defer></script>
<style>
.salon { position: relative; display: block; margin-bottom: 12px; border-radius: 22px; overflow: hidden; text-decoration: none; color: var(--ink); background: rgba(255,255,255,0.10);
  box-shadow: var(--glass-rim), var(--glass-drop); animation: arrive 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
.salon:hover { transform: translateY(-2px) scale(1.01); color: var(--ink); }
.salon .visuel { position: relative; height: 118px; display: flex; gap: 2px; background: linear-gradient(120deg, #3F836D, #14332A); }
.salon .visuel img { flex: 1; min-width: 0; height: 100%; object-fit: cover; background: #fff; }
.salon .visuel img.photo { object-fit: cover; }
.salon .palette { position: absolute; left: 12px; bottom: 10px; display: flex; }
.salon .palette i { width: 18px; height: 18px; border-radius: 50%; margin-right: -5px; box-shadow: 0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,0.3); }
.salon .texte { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px 13px; }
.salon h3 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
.salon p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-muted); }
@keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(0.97); } }
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--surface); color: var(--ink); font-family: var(--body); display: flex; flex-direction: column; padding: 0; overflow: hidden">
  <div style="padding: 20px 20px 0; flex-shrink: 0">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <p class="nestr-logo" aria-label="Nestr" style="margin: 0; font-size: 26px"><span class="nestr-accent">n</span>estr<span class="nestr-accent">.</span></p>
      <button id="sortir" type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 13px var(--body); cursor: pointer">Se déconnecter</button>
    </div>
    <h2 id="bonjour" style="margin: 18px 0 0; font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.8px">Mes salons</h2>
    <p id="logement" style="margin: 6px 0 0; font-size: 14px; line-height: 1.45; color: var(--ink-muted)">&nbsp;</p>
  </div>
  <div id="liste" role="list" aria-live="polite" style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px 110px"></div>
  <a id="nouveau" href="style.html" style="position: absolute; left: 24px; right: 24px; bottom: 28px; display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 999px; background: var(--pine); color: var(--surface); text-decoration: none; font-size: 16px; font-weight: 600; z-index: 5">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nouveau salon</a>
</div>
<script src="nestr.js"></script>
<script>
// Écran « Mes salons » : les salons enregistrés du compte, et le point de départ d'un nouveau.
(function () {
  var list = document.getElementById('liste');
  function note(text) {
    var p = document.createElement('p');
    p.style.cssText = 'margin:40px 12px 0;text-align:center;font-size:15px;line-height:1.5;color:var(--ink-muted)';
    p.textContent = text;
    list.textContent = '';
    list.appendChild(p);
  }
  Nestr.me.then(function (user) {
    if (!user) return;
    document.getElementById('bonjour').textContent = user.first_name ? 'Bonjour ' + user.first_name : 'Mes salons';
    var home = document.getElementById('logement'), r = user.room;
    home.textContent = r ? 'Ton salon : ' + (r.width_cm / 100).toFixed(2).replace('.', ',') + ' × ' + (r.length_cm / 100).toFixed(2).replace('.', ',') + ' m · ' : 'Logement à renseigner · ';
    var edit = document.createElement('a');
    edit.href = 'pieces.html'; edit.textContent = 'modifier';
    edit.style.cssText = 'color:var(--pine);font-weight:600';
    home.appendChild(edit);
    if (!r) document.getElementById('nouveau').href = 'pieces.html?compte=1';
  });
  document.getElementById('nouveau').addEventListener('click', function () {
    // Un nouveau salon repart du logement enregistré, sans reprendre les choix du précédent.
    var s = Nestr.get();
    try { localStorage.setItem('nestr-projet', JSON.stringify({ room: s.room, owner: s.owner })); sessionStorage.removeItem('nestr-inspirations'); sessionStorage.removeItem('nestr-envie'); } catch (e) {}
  });
  document.getElementById('sortir').addEventListener('click', function () {
    fetch('/api/auth/logout', { method: 'POST' }).catch(function () {}).then(function () {
      try { localStorage.removeItem('nestr-projet'); sessionStorage.clear(); } catch (e) {}
      location.href = 'accueil.html';
    });
  });
  note('Chargement de tes salons…');
  fetch('/api/projects').then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); }).then(function (j) {
    if (!j.projects.length) return note('Aucun salon pour l’instant. Crée le premier : il sera enregistré ici.');
    list.textContent = '';
    j.projects.forEach(function (p, i) {
      var a = document.createElement('a'), visual = document.createElement('div'), text = document.createElement('div'), left = document.createElement('div');
      a.className = 'salon'; a.href = 'rendu-3d.html?p=' + p.id; a.setAttribute('role', 'listitem');
      a.style.animationDelay = Math.min(i, 8) * 0.06 + 's';
      visual.className = 'visuel';
      (p.photo ? [p.photo] : p.images).forEach(function (src) {
        var img = document.createElement('img');
        img.src = src; img.alt = ''; img.loading = 'lazy'; if (p.photo) img.className = 'photo';
        img.onerror = function () { img.remove(); };
        visual.appendChild(img);
      });
      var pal = document.createElement('div'); pal.className = 'palette';
      (p.palette || []).forEach(function (hex) { if (/^#[0-9a-f]{6}$/i.test(hex)) { var d = document.createElement('i'); d.style.background = hex; pal.appendChild(d); } });
      visual.appendChild(pal);
      var title = document.createElement('h3'), sub = document.createElement('p'), price = document.createElement('p');
      var when = new Date(p.created_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' });
      title.textContent = 'Salon ' + String(p.style || '').toLowerCase();
      sub.textContent = when + ' · ' + p.count + ' produits' + (p.text ? ' · « ' + p.text.slice(0, 34) + (p.text.length > 34 ? '…' : '') + ' »' : '');
      price.className = 'data'; price.style.cssText = 'margin:0;font-size:15px;color:var(--ink);white-space:nowrap';
      price.textContent = Nestr.euro(p.total_eur);
      left.style.minWidth = '0'; left.append(title, sub);
      text.className = 'texte'; text.append(left, price);
      a.append(visual, text);
      list.appendChild(a);
    });
  }).catch(function (status) { if (status !== 401) note('Tes salons n’ont pas pu être chargés. Réessaie dans un instant.'); });
})();
</script>
</body>
</html>
