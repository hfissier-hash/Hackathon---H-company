  <div style="flex: 1"></div>
  <a href="envies.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #111111; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 600">Continuer</a>

<script>
document.querySelectorAll('.style-card').forEach(function (card) {
  card.addEventListener('click', function () {
    document.querySelectorAll('.style-card').forEach(function (c) {
      var on = c === card;
      c.setAttribute('aria-pressed', on ? 'true' : 'false');
      c.style.borderColor = on ? '#111111' : '#F4F3F0';
      c.querySelector('.tick').style.display = on ? 'flex' : 'none';
    });
  });
});
var budget = document.getElementById('budget');
budget.addEventListener('input', function () {
  document.getElementById('budget-label').textContent = Number(budget.value).toLocaleString('fr-FR') + ' €';
});
</script>
<script src="nestr.js"></script>
<script>
document.querySelector('a[href="envies.html"]').addEventListener('click', function () {
  var card = document.querySelector('.style-card[aria-pressed="true"]');
  Nestr.set({ style: card ? card.querySelector('p').textContent.trim() : 'Scandinave', budget_eur: Number(budget.value), projectId: null });
});
</script>
